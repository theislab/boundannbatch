[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "boundannbatch"
description = "Declarative multi-source streaming over annbatch"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Selman Ozleyen", email = "syozleyen@gmail.com" },
]
authors = [
  { name = "Selman Ozleyen" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  # numba: annbatch streams in-memory sparse arrays (an .h5ad X) with it; zarrs: its fast zarr codec pipeline
  "annbatch[numba,zarrs]>=0.3.1",
  # >=0.13 for the anndata.acc reference system (A.obsm[...] / adata[ref])
  "anndata>=0.13",
  "numpy",
  "pandas",
]
# GPU-resident streaming: annbatch can keep its read window on-device via cupy (preload_to_gpu) so batches
# arrive as GPU tensors with no per-step host->device copy. One extra per CUDA major, matching your driver
# and torch build; annbatch's extras pull cupy with its CUDA toolkit wheels, so no system CUDA is needed.
optional-dependencies.cupy-cuda12 = [
  "annbatch[cupy-cuda12]",
]
optional-dependencies.cupy-cuda13 = [
  "annbatch[cupy-cuda13]",
]
# EvalLoader(to="torch") yields torch tensors
optional-dependencies.torch = [
  "torch>=2",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://boundannbatch.readthedocs.io/"
urls.Homepage = "https://github.com/theislab/boundannbatch"
urls.Source = "https://github.com/theislab/boundannbatch"

[dependency-groups]
test = [ "pytest", "scipy" ]
doc = [
  "myst-parser",
  "scverse-misc[sphinx]>=0.1.2",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
]

[tool.hatch]
# Version comes from the git tag (hatch-vcs); `[project] version` is intentionally absent.
version.source = "vcs"

[tool.ruff]
line-length = 120
src = [ "src" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pyright]
pythonVersion = "3.12"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "tests" ]  # scheme_helpers.py: shared test helper imported bare
ini_options.addopts = [
  "--import-mode=importlib", # allow using test files with same name
  "--strict-markers",
  "--strict-config",
]
